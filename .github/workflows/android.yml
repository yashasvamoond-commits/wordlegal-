name: WordLegal — APK Build & UI Verification

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-web:
    name: Web UI verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (tablet + phone, PDF/DOCX export)
        id: smoke
        continue-on-error: true
        run: node tools/smoke.mjs
      - name: Publish smoke report to branch (for inspection)
        if: always()
        run: |
          mkdir -p ci-run
          cp -f artifacts/report.json ci-run/ 2>/dev/null || true
          cp -f artifacts/sample-export.pdf ci-run/ 2>/dev/null || true
          cp -f artifacts/sample-export.docx ci-run/ 2>/dev/null || true
          rm -rf ci-run/screens
          cp -Rf artifacts/screens ci-run/screens 2>/dev/null || true
          if [ -d ci-run/screens ]; then
            for f in ci-run/screens/*.png; do
              [ -f "$f" ] && convert "$f" -resize 1100x -quality 82 "${f%.png}.jpg" 2>/dev/null && rm -f "$f"
            done
          fi
          git config user.name "WordLegal CI"
          git config user.email "ci@wordlegal.app"
          git add -f ci-run
          git commit -m "ci: smoke report [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Create release keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/wordlegal.keystore" \
            -alias wordlegal -storepass wordlegal2026 -keypass wordlegal2026 \
            -dname "CN=WordLegal, OU=Legal Drafting, O=WordLegal, L=Jaipur, ST=Rajasthan, C=IN" \
            -keyalg RSA -keysize 2048 -validity 10950
      - name: Build debug + release APKs
        working-directory: android
        env:
          WL_KEYSTORE: ${{ runner.temp }}/wordlegal.keystore
          WL_STORE_PASS: wordlegal2026
          WL_KEY_ALIAS: wordlegal
          WL_KEY_PASS: wordlegal2026
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/WordLegal-1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/WordLegal-1.0.0-debug.apk
          ls -lh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: WordLegal-APK
          path: artifacts/*.apk
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "वर्डलीगल (WordLegal) v1.0.0 — APK"
          body: |
            हिन्दी विधिक मसौदा ऐप — लीगल साइज़ (8.5 × 14 इंच) न्यायालयीन दस्तावेज़।

            **फ़ाइल:** `WordLegal-1.0.0.apk` (release, साइन किया गया) — सीधे टैबलेट में इंस्टॉल करें।
            `WordLegal-1.0.0-debug.apk` — वैकल्पिक डिबग बिल्ड।

            Android 8.0+ (API 26+) · योग टैब प्लस 2026 सहित सभी टैबलेट/फ़ोन हेतु।
          files: artifacts/*.apk
          fail_on_unmatched_files: false
          make_latest: true
